name: ci

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate model manifest
        run: python tools/validate_manifest.py
      - name: Validate completion checklist
        run: python tools/validate_checklist.py
      - name: Configure
        run: cmake -S . -B build -DNEURALPASS_BUILD_ADDON=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
