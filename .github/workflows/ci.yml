name: ci

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate model manifest
        run: python tools/validate_manifest.py
      - name: Validate completion checklist
        run: python tools/validate_checklist.py
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DNEURALPASS_BUILD_ADDON=OFF
      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release
      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build and test Windows DirectML add-on
        if: runner.os == 'Windows'
        shell: cmd
        env:
          NP_DIRECTML_TEST: OFF
        run: build_windows.cmd directml
      - name: Build and test Windows x86 preview add-on
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.cmd preview x86
      - name: Upload Windows DirectML package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: NeuralPass-windows-x64-directml
          path: dist/NeuralPass
          if-no-files-found: error
      - name: Upload Windows x86 preview package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: NeuralPass-windows-x86-preview
          path: dist/NeuralPass-x86
          if-no-files-found: error
